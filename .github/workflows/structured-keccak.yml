name: Structured private Keccak spending
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/hidden-membership/smallwood/**'
      - 'experiments/hidden-membership/paths/**'
      - 'experiments/fresh-spend/binding/**'
      - 'experiments/structured-keccak/**'
      - '.github/workflows/structured-keccak.yml'
  pull_request:
    paths:
      - 'experiments/hidden-membership/smallwood/**'
      - 'experiments/hidden-membership/paths/**'
      - 'experiments/fresh-spend/binding/**'
      - 'experiments/structured-keccak/**'
      - '.github/workflows/structured-keccak.yml'
permissions:
  contents: read
jobs:
  funded:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Ubuntu 24.04 system Python and native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-dev python3-numpy libssl-dev cmake gcc curl time xz-utils
      - name: Rebuild the proof and verify a fresh, funded private payment
        run: PATH=/usr/bin:/bin bash experiments/structured-keccak/reproduce.sh "$RUNNER_TEMP/structured-keccak"
