name: Funded C snapshot and old-wallet recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/snapshot-bootstrap/**'
      - '.github/workflows/snapshot-bootstrap.yml'
  pull_request:
    paths:
      - 'experiments/snapshot-bootstrap/**'
      - '.github/workflows/snapshot-bootstrap.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install isolated Linux roles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap python3 curl
      - name: Bootstrap, restore, spend and replay both branches
        run: bash experiments/snapshot-bootstrap/reproduce.sh "$RUNNER_TEMP/funded-snapshot"
      - name: Upload public measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snapshot-measurements
          path: ${{ runner.temp }}/funded-snapshot/results.json
          if-no-files-found: error
