name: Public sandbox environment probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-startup:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout the selected public revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Provision only the public startup prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 curl xz-utils bubblewrap
          mkdir -p .tools .work
          curl --fail --location --silent --show-error --output .tools/node-v24.22.1-linux-x64.tar.xz https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz
          echo '6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6  .tools/node-v24.22.1-linux-x64.tar.xz' | sha256sum -c -
          tar -xf .tools/node-v24.22.1-linux-x64.tar.xz -C .tools
      - name: Run unchanged public startup probes
        shell: bash
        run: |
          set -euo pipefail
          python3 -I experiments/network-feasibility/wallet-integration/ci_preflight.py --node "$PWD/.tools/node-v24.22.1-linux-x64/bin/node" --output "$PWD/.work/ubuntu22-public-preflight01.json"
      - name: Preserve the fixed public receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu22-public-preflight
          if-no-files-found: error
          retention-days: 14
          path: .work/ubuntu22-public-preflight01.json
          include-hidden-files: true
