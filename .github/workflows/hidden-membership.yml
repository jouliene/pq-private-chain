name: Two hidden funded inputs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/hidden-membership/**'
      - 'experiments/fresh-spend/binding/**'
      - 'experiments/fresh-spend/proof/**'
      - '.github/workflows/hidden-membership.yml'
  pull_request:
    paths:
      - 'experiments/hidden-membership/**'
      - 'experiments/fresh-spend/binding/**'
      - 'experiments/fresh-spend/proof/**'
      - '.github/workflows/hidden-membership.yml'
permissions:
  contents: read
jobs:
  funded:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Ubuntu 24.04 system Python and native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-dev python3-numpy libssl-dev cmake gcc curl time xz-utils
      - name: Rebuild the profiles and prove membership from fresh funding
        run: PATH=/usr/bin:/bin bash experiments/hidden-membership/reproduce.sh "$RUNNER_TEMP/hidden-membership"
