name: EAR1 adaptive authorization
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/ear1-authorization/**'
      - '.github/workflows/ear1-authorization.yml'
  pull_request:
    paths:
      - 'experiments/ear1-authorization/**'
      - '.github/workflows/ear1-authorization.yml'
permissions:
  contents: read
jobs:
  decision:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned-distribution build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-dev python3-numpy python3-psutil gcc libssl-dev curl xz-utils
      - name: Verify public transcript, fresh conditional decoding and decision calculations
        run: PATH=/usr/bin:/bin bash experiments/ear1-authorization/reproduce.sh "$RUNNER_TEMP/ear1"
