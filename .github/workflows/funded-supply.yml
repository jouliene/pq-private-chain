name: Funded C token supply invariant
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/funded-supply/**'
      - 'experiments/funded-conservation/Conservation.lean'
      - 'experiments/funded-conservation/source_check.py'
      - 'experiments/funded-conservation/audit.py'
      - '.github/workflows/funded-supply.yml'
  pull_request:
    paths:
      - 'experiments/funded-supply/**'
      - 'experiments/funded-conservation/Conservation.lean'
      - 'experiments/funded-conservation/source_check.py'
      - 'experiments/funded-conservation/audit.py'
      - '.github/workflows/funded-supply.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install role isolation and unpacking tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap zstd curl git
      - name: Check the supply invariant, maximum burn and winning replay
        run: bash experiments/funded-supply/reproduce.sh "$RUNNER_TEMP/supply"
      - name: Publish public counts and identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-evidence
          path: |
            ${{ runner.temp }}/supply/result.json
            ${{ runner.temp }}/supply/source-result.json
          if-no-files-found: error
