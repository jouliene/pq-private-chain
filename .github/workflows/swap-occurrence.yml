name: Funded C atomic swap conservation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/swap-occurrence/**'
      - 'experiments/partial-fills/**'
      - 'experiments/atomic-swap/**'
      - 'experiments/occurrence-supply/**'
      - 'experiments/supply-refinement/**'
      - 'experiments/funded-membership/**'
      - 'experiments/stranger-swap/**'
      - 'experiments/funded-supply/**'
      - 'experiments/funded-conservation/Conservation.lean'
      - 'experiments/funded-conservation/source_check.py'
      - 'experiments/funded-conservation/audit.py'
      - '.github/workflows/swap-occurrence.yml'
  pull_request:
    paths:
      - 'experiments/swap-occurrence/**'
      - 'experiments/partial-fills/**'
      - 'experiments/atomic-swap/**'
      - 'experiments/occurrence-supply/**'
      - 'experiments/supply-refinement/**'
      - 'experiments/funded-membership/**'
      - 'experiments/stranger-swap/**'
      - 'experiments/funded-supply/**'
      - 'experiments/funded-conservation/Conservation.lean'
      - 'experiments/funded-conservation/source_check.py'
      - 'experiments/funded-conservation/audit.py'
      - '.github/workflows/swap-occurrence.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install role isolation and unpacking tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap zstd curl git openssl xz-utils
      - name: Verify occurrence conservation across two signed partial fills
        run: bash experiments/swap-occurrence/reproduce.sh "$RUNNER_TEMP/supply"
      - name: Publish public counts and identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swap-occurrence-evidence
          path: |
            ${{ runner.temp }}/supply/case/observed.json
            ${{ runner.temp }}/supply/kernel-result.json
            ${{ runner.temp }}/supply/source-result.json
          if-no-files-found: error
