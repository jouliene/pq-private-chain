name: SGM1 native monetary admission
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/sgm1-admission/**'
      - 'experiments/sgm1-security/**'
      - 'experiments/structured-keccak/**'
      - 'experiments/hidden-membership/**'
      - 'experiments/fresh-spend/binding/**'
      - '.github/workflows/sgm1-admission.yml'
  pull_request:
    paths:
      - 'experiments/sgm1-admission/**'
      - 'experiments/sgm1-security/**'
      - 'experiments/structured-keccak/**'
      - 'experiments/hidden-membership/**'
      - 'experiments/fresh-spend/binding/**'
      - '.github/workflows/sgm1-admission.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Ubuntu 24.04 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-dev python3-numpy python3-psutil libssl-dev g++ curl xz-utils
      - name: Fresh public differential, swap and restored onward spend
        run: PATH=/usr/bin:/bin SGM1_PROVERS=2 bash experiments/sgm1-admission/reproduce.sh "$RUNNER_TEMP/sgm1" ci
      - name: Security bounds, wallet consent and a fresh early-degree payment
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          SW_FIELD: gf256
        run: |
          export PATH=/usr/bin:/bin
          export PYTHONPATH="$RUNNER_TEMP/sgm1/native"
          export SGM1_NATIVE_LIB="$PYTHONPATH/libsgm1_verify.so"
          export FS_RECEIPT_NODE="$RUNNER_TEMP/sgm1/node-v24.22.1-linux-x64/bin/node"
          here=experiments/sgm1-security
          python3 -B "$here/bounds.py" > "$RUNNER_TEMP/bounds.json"
          cmp "$RUNNER_TEMP/bounds.json" "$here/evidence/BOUNDS.json"
          python3 -B "$here/wallet_checks.py" "$RUNNER_TEMP/paired-denials" negative
          python3 -B "$here/early_degree.py" cycle "$RUNNER_TEMP/early-payment" "$PYTHONPATH"
          python3 -B "$here/check_payment.py" "$RUNNER_TEMP/early-payment"
