name: Delayed certificate public bootstrap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/delayed-eight/**'
      - '.github/workflows/delayed-certificates.yml'
  pull_request:
    paths:
      - 'experiments/delayed-eight/**'
      - '.github/workflows/delayed-certificates.yml'
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the locked native toolchain and public verifier sandbox
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap build-essential git python3
          rustup toolchain install 1.93.0 --profile minimal
          bwrap --unshare-all --die-with-parent --new-session --cap-drop ALL --ro-bind / / -- /usr/bin/true
      - name: Derive both verifier keys and check the retained forks and restored spend from genesis
        run: /usr/bin/python3 -IB experiments/delayed-eight/reproduce.py "$RUNNER_TEMP/d8" --public-only
      - name: Save numerical public validation results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: delayed-certificates-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/d8/replay/PUBLIC.json
